<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BRD & TRD Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0c10;--surface:#13151c;--surface2:#1c1f2b;--border:#272a38;--border2:#323648;--accent:#6c63ff;--accent2:#a78bfa;--gold:#f0b429;--text:#e8eaf0;--muted:#7c8098;--success:#34d399;--danger:#f87171;--radius:10px;--radius-lg:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
.page{max-width:860px;margin:0 auto;padding:3rem 2rem 6rem}
.hero{margin-bottom:2.5rem}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(108,99,255,.12);border:1px solid rgba(108,99,255,.3);color:var(--accent2);font-size:11px;font-weight:500;padding:4px 12px;border-radius:99px;margin-bottom:1.25rem;letter-spacing:.06em;text-transform:uppercase}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
h1{font-family:'Syne',sans-serif;font-size:clamp(2rem,5vw,3.2rem);font-weight:800;line-height:1.08;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 0%,var(--accent2) 60%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.75rem}
.subtitle{color:var(--muted);font-size:15px;max-width:520px}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;margin-bottom:1.5rem}
.form-card-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:1.5rem;display:flex;align-items:center;gap:8px}
.form-card-title::after{content:'';flex:1;height:1px;background:var(--border)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.field:last-child{margin-bottom:0}
.field label{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;resize:none;transition:border-color .2s}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.6}
.gen-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent) 0%,#8b5cf6 100%);color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;border:none;border-radius:var(--radius);cursor:pointer;transition:opacity .2s,transform .1s}
.gen-btn:hover{opacity:.9;transform:translateY(-1px)}
.gen-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.progress-wrap{height:3px;background:var(--border);border-radius:99px;margin-top:12px;display:none}
.progress-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--gold));width:0%;transition:width .4s ease}
.status{text-align:center;font-size:13px;color:var(--muted);padding:10px 0;min-height:36px}
.status.err{color:var(--danger)}
.status.ok{color:var(--success)}
.output{display:none;margin-top:2rem}
.tabs{display:flex;gap:6px;margin-bottom:1.5rem}
.tab{padding:7px 18px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;letter-spacing:.04em;border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;background:transparent;color:var(--muted);transition:all .2s}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none}.panel.active{display:block}
.doc-section{margin-bottom:1.75rem}
.doc-section-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent2);margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--border)}
.doc-body{font-size:14px;line-height:1.75;color:#c8cad8}
.chips-wrap{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 12px;border-radius:99px;background:rgba(108,99,255,.1);border:1px solid rgba(108,99,255,.25);color:var(--accent2)}
ul.bdots{padding-left:1.1rem}
ul.bdots li{font-size:14px;line-height:1.7;color:#c8cad8;margin-bottom:3px}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--surface2)}
th{padding:9px 12px;text-align:left;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5;color:#c8cad8}
tr:last-child td{border-bottom:none}
code{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold)}
.badge-m{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;font-family:'DM Mono',monospace}
.b-post{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.b-get{background:rgba(96,165,250,.12);color:#60a5fa;border:1px solid rgba(96,165,250,.3)}
.b-put{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.b-del{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.json-toolbar{display:flex;justify-content:flex-end;margin-bottom:.5rem}
.copy-btn{font-size:12px;padding:5px 12px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.copy-btn:hover{border-color:var(--accent);color:var(--text)}
.json-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;font-family:'DM Mono',monospace;font-size:12px;overflow:auto;max-height:420px;white-space:pre-wrap;color:#9fa3b8;line-height:1.65}
@media(max-width:600px){.grid2{grid-template-columns:1fr}.page{padding:1.5rem 1rem 4rem}}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="badge"><span class="dot"></span>AI-Powered Document Generator</div>
    <h1>BRD & TRD<br/>Generator</h1>
    <p class="subtitle">Enter your project details — get a complete Business & Technical Requirements Document instantly.</p>
  </div>

  <div style="background:#1c1f2b;border:1px solid #272a38;border-radius:16px;padding:1.25rem 1.5rem;margin-bottom:1.5rem;position:relative;overflow:hidden">
<div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#6c63ff,#f0b429)"></div>
<div style="font-size:11px;font-weight:700;color:#7c8098;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.6rem">Anthropic API Key</div>
<input type="password" id="apikey" placeholder="sk-ant-api03-..." style="width:100%;background:#0b0c10;border:1px solid #272a38;border-radius:10px;padding:10px 14px;color:#e8eaf0;font-family:'DM Mono',monospace;font-size:13px;outline:none" autocomplete="off"/>
<a href="https://console.anthropic.com/settings/keys" target="_blank" style="font-size:12px;color:#a78bfa;margin-top:.5rem;display:inline-block">→ Get your free API key</a>
</div>
<div class="form-card">
    <div class="form-card-title">Project Details</div>
    <div class="grid2">
      <div class="field"><label>Project Name</label><input id="f-name" placeholder="e.g. HireIQ"/></div>
      <div class="field"><label>Industry</label><input id="f-industry" placeholder="e.g. HR / Recruitment"/></div>
    </div>
    <div class="field"><label>Description</label><textarea id="f-desc" rows="3" placeholder="What does this project do? What problem does it solve?"></textarea></div>
    <div class="grid2">
      <div class="field"><label>Target Users</label><input id="f-users" placeholder="e.g. Enterprise HR teams"/></div>
      <div class="field"><label>Deadline</label><input id="f-deadline" placeholder="e.g. 6 weeks"/></div>
    </div>
    <div class="field"><label>Key Features</label><textarea id="f-features" rows="2" placeholder="Resume screening, JD generator, scorecard..."></textarea></div>
    <div class="field"><label>Preferred Tech Stack</label><input id="f-tech" placeholder="e.g. React, Node.js, PostgreSQL"/></div>
  </div>

  <button class="gen-btn" id="gen-btn" onclick="generate()">Generate BRD & TRD →</button>
  <div class="progress-wrap" id="prog-wrap"><div class="progress-bar" id="prog-bar"></div></div>
  <div class="status" id="status"></div>

  <div class="output" id="output">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('brd',this)">BRD</button>
      <button class="tab" onclick="switchTab('trd',this)">TRD</button>
      <button class="tab" onclick="switchTab('json',this)">JSON</button>
    </div>
    <div class="panel active" id="panel-brd"></div>
    <div class="panel" id="panel-trd"></div>
    <div class="panel" id="panel-json">
      <div class="json-toolbar"><button class="copy-btn" onclick="copyJSON()">Copy JSON</button></div>
      <div class="json-box" id="jbox"></div>
    </div>
  </div>
</div>

<script>
let lastJSON=null;
function switchTab(n,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));el.classList.add('active');document.getElementById('panel-'+n).classList.add('active')}
function bclass(m){return{POST:'b-post',GET:'b-get',PUT:'b-put',PATCH:'b-put',DELETE:'b-del'}[m]||'b-post'}
function sec(t,h){return`<div class="doc-section"><div class="doc-section-title">${t}</div><div class="doc-body">${h}</div></div>`}
function chips(a){return`<div class="chips-wrap">${a.map(s=>`<span class="chip">${s}</span>`).join('')}</div>`}
function dots(a){return`<ul class="bdots">${a.map(s=>`<li>${s}</li>`).join('')}</ul>`}
function renderBRD(b){document.getElementById('panel-brd').innerHTML=[sec('Project Overview',`<p>${b.project_overview}</p>`),sec('Business Objective',`<p>${b.business_objective}</p>`),sec('Stakeholders',chips(b.stakeholders)),sec('Business Requirements',dots(b.business_requirements)),sec('Functional Requirements',dots(b.functional_requirements)),sec('Success Metrics',`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Metric</th></tr></thead><tbody>${b.success_metrics.map((m,i)=>`<tr><td>${i+1}</td><td>${m}</td></tr>`).join('')}</tbody></table></div>`),sec('Risks & Mitigations',dots(b.risks))].join('')}
function renderTRD(t){
  const ts=t.technology_stack.map(i=>{const k=Object.keys(i);return`<tr><td><strong>${i[k[0]]}</strong></td><td>${i[k[1]]||''}</td></tr>`}).join('');
  const db=t.database_design.map(i=>{const k=Object.keys(i);return`<tr><td><code>${i[k[0]]}</code></td><td style="font-family:'DM Mono',monospace;font-size:11px">${i[k[1]]||''}</td></tr>`}).join('');
  const api=t.api_requirements.map(i=>{const m=i.method||'POST',ep=i.endpoint||i.path||'',ds=i.description||i.desc||'';return`<tr><td><span class="badge-m ${bclass(m)}">${m}</span></td><td><code>${ep}</code></td><td>${ds}</td></tr>`}).join('');
  document.getElementById('panel-trd').innerHTML=[sec('System Overview',`<p>${t.system_overview}</p>`),sec('Architecture',`<p>${t.architecture}</p>`),sec('Technology Stack',`<div class="tbl-wrap"><table><thead><tr><th>Layer</th><th>Technologies</th></tr></thead><tbody>${ts}</tbody></table></div>`),sec('Database Design',`<div class="tbl-wrap"><table><thead><tr><th>Table</th><th>Key Columns</th></tr></thead><tbody>${db}</tbody></table></div>`),sec('API Requirements',`<div class="tbl-wrap"><table><thead><tr><th>Method</th><th>Endpoint</th><th>Description</th></tr></thead><tbody>${api}</tbody></table></div>`),sec('Security Requirements',dots(t.security_requirements)),sec('Deployment Plan',`<p>${t.deployment_plan}</p>`)].join('')}
function copyJSON(){if(!lastJSON)return;navigator.clipboard.writeText(JSON.stringify(lastJSON,null,2)).then(()=>{const b=document.querySelector('.copy-btn');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy JSON',2000)})}
function setProgress(p){document.getElementById('prog-bar').style.width=p+'%'}
async function generate(){
  const name=document.getElementById('f-name').value.trim();
  const desc=document.getElementById('f-desc').value.trim();
  const st=document.getElementById('status');
  if(!name||!desc){st.className='status err';st.textContent='Project name and description are required.';return}
  const btn=document.getElementById('gen-btn');
  btn.disabled=true;
  document.getElementById('output').style.display='none';
  document.getElementById('prog-wrap').style.display='block';
  setProgress(5);
  const steps=['Analysing project details...','Structuring requirements...','Generating BRD...','Generating TRD...','Finalising document...'];
  let si=0;st.className='status';st.textContent=steps[0];
  const ticker=setInterval(()=>{si=(si+1)%steps.length;st.textContent=steps[si];setProgress(Math.min(88,(si+1)*18))},2200);
  try{
    const apiKey=document.getElementById('apikey').value.trim();
    if(!apiKey){clearInterval(ticker);st.className='status err';st.textContent='Please enter your Anthropic API key.';btn.disabled=false;return;}
    const prompt=`You are a strict Business Analyst and Software Architect. Generate a comprehensive BRD and TRD. Return ONLY valid raw JSON no markdown no explanation.
PROJECT: Name: ${name}, Industry: ${document.getElementById('f-industry').value.trim()||'N/A'}, Description: ${desc}, Users: ${document.getElementById('f-users').value.trim()||'N/A'}, Features: ${document.getElementById('f-features').value.trim()||'N/A'}, Tech: ${document.getElementById('f-tech').value.trim()||'N/A'}, Deadline: ${document.getElementById('f-deadline').value.trim()||'N/A'}
Required JSON: {"brd":{"project_overview":"","business_objective":"","stakeholders":[],"business_requirements":[],"functional_requirements":[],"success_metrics":[],"risks":[]},"trd":{"system_overview":"","architecture":"","technology_stack":[{"layer":"","tech":""}],"database_design":[{"table":"","columns":""}],"api_requirements":[{"method":"","endpoint":"","desc":""}],"security_requirements":[],"deployment_plan":""}}`;
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:4000,messages:[{role:'user',content:prompt}]})
    });
    clearInterval(ticker);
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`)}
    const raw=await res.json();
    const text=raw.content.map(b=>b.text||'').join('').replace(/\`\`\`json|\`\`\`/g,'').trim();
    const data=JSON.parse(text);
    lastJSON=data;
    renderBRD(data.brd);
    renderTRD(data.trd);
    document.getElementById('jbox').textContent=JSON.stringify(data,null,2);
    setProgress(100);
    document.getElementById('output').style.display='block';
    st.className='status ok';st.textContent='✓ Document generated successfully.';
    setTimeout(()=>document.getElementById('prog-wrap').style.display='none',800);
    document.getElementById('output').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    clearInterval(ticker);setProgress(0);
    setTimeout(()=>document.getElementById('prog-wrap').style.display='none',400);
    st.className='status err';st.textContent='Error: '+e.message;
  }finally{btn.disabled=false}
}
</script>
</body>
</html>
