<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BRD & TRD Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0b0c10;--sur:#13151c;--sur2:#1c1f2b;--bdr:#272a38;--acc:#6c63ff;--ac2:#a78bfa;--gld:#f0b429;--txt:#e8eaf0;--mut:#7c8098;--ok:#34d399;--err:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;min-height:100vh}
.pg{max-width:820px;margin:0 auto;padding:3rem 1.5rem 6rem}
h1{font-family:'Syne',sans-serif;font-size:clamp(2rem,5vw,3rem);font-weight:800;background:linear-gradient(135deg,#fff,var(--ac2),var(--gld));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}
.sub{color:var(--mut);margin-bottom:2rem}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:16px;padding:1.75rem;margin-bottom:1.25rem}
.card-ttl{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:1.25rem;display:flex;align-items:center;gap:8px}
.card-ttl::after{content:'';flex:1;height:1px;background:var(--bdr)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:.9rem}
.f:last-child{margin-bottom:0}
.f label{font-size:11px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.f input,.f textarea{background:var(--sur2);border:1px solid var(--bdr);border-radius:10px;padding:9px 13px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;resize:none;transition:border-color .2s}
.f input:focus,.f textarea:focus{border-color:var(--acc)}
.f input::placeholder,.f textarea::placeholder{color:var(--mut);opacity:.5}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--acc),#8b5cf6);color:#fff;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.88}.btn:disabled{opacity:.4;cursor:not-allowed}
.prog{height:3px;background:var(--bdr);border-radius:99px;margin-top:10px;display:none}
.prog-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--gld));width:0%;transition:width .4s}
.st{text-align:center;font-size:13px;color:var(--mut);padding:8px 0;min-height:32px}
.st.err{color:var(--err)}.st.ok{color:var(--ok)}
.out{display:none;margin-top:2rem}
.tabs{display:flex;gap:6px;margin-bottom:1.25rem}
.tab{padding:6px 16px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;border:1px solid var(--bdr);border-radius:10px;cursor:pointer;background:transparent;color:var(--mut);transition:all .2s}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.pnl{display:none}.pnl.active{display:block}
.ds{margin-bottom:1.5rem}
.dt{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ac2);margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid var(--bdr)}
.db{font-size:14px;line-height:1.75;color:#c8cad8}
.cw{display:flex;flex-wrap:wrap;gap:5px}
.ch{font-size:12px;padding:3px 11px;border-radius:99px;background:rgba(108,99,255,.1);border:1px solid rgba(108,99,255,.25);color:var(--ac2)}
ul.bl{padding-left:1rem}ul.bl li{font-size:14px;line-height:1.7;color:#c8cad8;margin-bottom:2px}
.tw{overflow-x:auto;border-radius:10px;border:1px solid var(--bdr)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--sur2)}
th{padding:8px 11px;text-align:left;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--bdr)}
td{padding:8px 11px;border-bottom:1px solid var(--bdr);vertical-align:top;line-height:1.5;color:#c8cad8}
tr:last-child td{border-bottom:none}
code{font-family:'DM Mono',monospace;font-size:12px;color:var(--gld)}
.bm{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;font-family:'DM Mono',monospace}
.bp{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.bg{background:rgba(96,165,250,.12);color:#60a5fa;border:1px solid rgba(96,165,250,.3)}
.bu{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.jt{display:flex;justify-content:flex-end;margin-bottom:.4rem}
.cb{font-size:12px;padding:4px 11px;background:var(--sur2);border:1px solid var(--bdr);border-radius:10px;color:var(--mut);cursor:pointer;font-family:'DM Sans',sans-serif}
.jb{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:1rem;font-family:'DM Mono',monospace;font-size:12px;overflow:auto;max-height:400px;white-space:pre-wrap;color:#9fa3b8;line-height:1.6}
.api-box{background:var(--sur);border:1px solid var(--bdr);border-radius:16px;padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.api-lbl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem}
.api-input{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:10px;padding:9px 13px;color:var(--txt);font-family:'DM Mono',monospace;font-size:13px;outline:none}
@media(max-width:600px){.g2{grid-template-columns:1fr}.pg{padding:1.5rem 1rem 4rem}}
</style>
</head>
<body>
<div class="pg">
  <h1>BRD & TRD Generator</h1>
  <p class="sub">Enter your project details — get a complete requirements document instantly.</p>

  <div class="api-box">
    <div class="api-lbl">OpenAI API Key</div>
    <input class="api-input" type="password" id="apikey" placeholder="sk-proj-..." autocomplete="off"/>
    <div style="font-size:11px;color:var(--mut);margin-top:.4rem">Get your key at <a href="https://platform.openai.com/api-keys" target="_blank" style="color:var(--ac2)">platform.openai.com/api-keys</a></div>
  </div>

  <div class="card">
    <div class="card-ttl">Project Details</div>
    <div class="g2">
      <div class="f"><label>Project Name</label><input id="fn" placeholder="e.g. MediLib"/></div>
      <div class="f"><label>Industry</label><input id="fi" placeholder="e.g. Healthcare"/></div>
    </div>
    <div class="f"><label>Description</label><textarea id="fd" rows="3" placeholder="What does this project do?"></textarea></div>
    <div class="g2">
      <div class="f"><label>Target Users</label><input id="fu" placeholder="e.g. Doctors, nurses"/></div>
      <div class="f"><label>Deadline</label><input id="fdl" placeholder="e.g. 6 weeks"/></div>
    </div>
    <div class="f"><label>Key Features</label><textarea id="ff" rows="2" placeholder="Book search, AI summary..."></textarea></div>
    <div class="f"><label>Tech Stack</label><input id="ft" placeholder="e.g. React, Node.js, PostgreSQL"/></div>
  </div>

  <button class="btn" id="gb" onclick="go()">Generate BRD & TRD →</button>
  <div class="prog" id="pw"><div class="prog-bar" id="pb"></div></div>
  <div class="st" id="st"></div>

  <div class="out" id="out">
    <div class="tabs">
      <button class="tab active" onclick="sw('brd',this)">BRD</button>
      <button class="tab" onclick="sw('trd',this)">TRD</button>
      <button class="tab" onclick="sw('json',this)">JSON</button>
    </div>
    <div class="pnl active" id="p-brd"></div>
    <div class="pnl" id="p-trd"></div>
    <div class="pnl" id="p-json"><div class="jt"><button class="cb" onclick="cj()">Copy</button></div><div class="jb" id="jb"></div></div>
  </div>
</div>
<script>
var lj=null;
function sw(n,e){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('active'));e.classList.add('active');document.getElementById('p-'+n).classList.add('active')}
function bc(m){return{POST:'bp',GET:'bg',PUT:'bu',PATCH:'bu',DELETE:'bp'}[m]||'bp'}
function s(t,h){return'<div class="ds"><div class="dt">'+t+'</div><div class="db">'+h+'</div></div>'}
function ch(a){return'<div class="cw">'+a.map(x=>'<span class="ch">'+x+'</span>').join('')+'</div>'}
function bl(a){return'<ul class="bl">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>'}
function rB(b){document.getElementById('p-brd').innerHTML=[s('Project Overview','<p>'+b.project_overview+'</p>'),s('Business Objective','<p>'+b.business_objective+'</p>'),s('Stakeholders',ch(b.stakeholders)),s('Business Requirements',bl(b.business_requirements)),s('Functional Requirements',bl(b.functional_requirements)),s('Success Metrics','<div class="tw"><table><thead><tr><th>#</th><th>Metric</th></tr></thead><tbody>'+b.success_metrics.map((m,i)=>'<tr><td>'+(i+1)+'</td><td>'+m+'</td></tr>').join('')+'</tbody></table></div>'),s('Risks & Mitigations',bl(b.risks))].join('')}
function rT(t){
  var ts=t.technology_stack.map(i=>{var v=typeof i==='object'?Object.values(i):i;return'<tr><td><strong>'+v[0]+'</strong></td><td>'+v[1]+'</td></tr>'}).join('');
  var db=t.database_design.map(i=>{var v=typeof i==='object'?Object.values(i):i;return'<tr><td><code>'+v[0]+'</code></td><td style="font-family:monospace;font-size:11px">'+v[1]+'</td></tr>'}).join('');
  var ap=t.api_requirements.map(i=>{var m=i.method||'POST',e=i.endpoint||'',d=i.description||i.desc||'';return'<tr><td><span class="bm '+bc(m)+'">'+m+'</span></td><td><code>'+e+'</code></td><td>'+d+'</td></tr>'}).join('');
  document.getElementById('p-trd').innerHTML=[s('System Overview','<p>'+t.system_overview+'</p>'),s('Architecture','<p>'+t.architecture+'</p>'),s('Technology Stack','<div class="tw"><table><thead><tr><th>Layer</th><th>Technologies</th></tr></thead><tbody>'+ts+'</tbody></table></div>'),s('Database Design','<div class="tw"><table><thead><tr><th>Table</th><th>Columns</th></tr></thead><tbody>'+db+'</tbody></table></div>'),s('API Requirements','<div class="tw"><table><thead><tr><th>Method</th><th>Endpoint</th><th>Description</th></tr></thead><tbody>'+ap+'</tbody></table></div>'),s('Security Requirements',bl(t.security_requirements)),s('Deployment Plan','<p>'+t.deployment_plan+'</p>')].join('')}
function cj(){if(!lj)return;navigator.clipboard.writeText(JSON.stringify(lj,null,2)).then(()=>{var b=document.querySelector('.cb');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',2000)})}
function sp(p){document.getElementById('pb').style.width=p+'%'}
async function go(){
  var apiKey=document.getElementById('apikey').value.trim();
  var name=document.getElementById('fn').value.trim();
  var desc=document.getElementById('fd').value.trim();
  var st=document.getElementById('st');
  if(!apiKey){st.className='st err';st.textContent='Please enter your OpenAI API key.';return}
  if(!name||!desc){st.className='st err';st.textContent='Project name and description are required.';return}
  var btn=document.getElementById('gb');
  btn.disabled=true;
  document.getElementById('out').style.display='none';
  document.getElementById('pw').style.display='block';
  sp(5);
  var steps=['Analysing details...','Structuring requirements...','Generating BRD...','Generating TRD...','Finalising...'];
  var si=0;st.className='st';st.textContent=steps[0];
  var tk=setInterval(()=>{si=(si+1)%steps.length;st.textContent=steps[si];sp(Math.min(85,(si+1)*17))},2000);
  var pr='You are a strict Business Analyst and Software Architect. Generate a comprehensive BRD and TRD. Return ONLY valid raw JSON, no markdown, no explanation.\nPROJECT: Name:'+name+', Industry:'+(document.getElementById('fi').value.trim()||'N/A')+', Description:'+desc+', Users:'+(document.getElementById('fu').value.trim()||'N/A')+', Features:'+(document.getElementById('ff').value.trim()||'N/A')+', Tech:'+(document.getElementById('ft').value.trim()||'N/A')+', Deadline:'+(document.getElementById('fdl').value.trim()||'N/A')+'\nReturn this JSON: {"brd":{"project_overview":"","business_objective":"","stakeholders":[],"business_requirements":[],"functional_requirements":[],"success_metrics":[],"risks":[]},"trd":{"system_overview":"","architecture":"","technology_stack":[{"layer":"","tech":""}],"database_design":[{"table":"","columns":""}],"api_requirements":[{"method":"","endpoint":"","desc":""}],"security_requirements":[],"deployment_plan":""}}';
  try{
    var r=await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:pr}],temperature:0.3})
    });
    clearInterval(tk);
    if(!r.ok){var e=await r.json().catch(()=>({}));throw new Error(e.error?.message||'HTTP '+r.status)}
    var d=await r.json();
    var txt=d.choices[0].message.content.replace(/```json|```/g,'').trim();
    var data=JSON.parse(txt);
    lj=data;rB(data.brd);rT(data.trd);
    document.getElementById('jb').textContent=JSON.stringify(data,null,2);
    sp(100);document.getElementById('out').style.display='block';
    st.className='st ok';st.textContent='✓ Generated successfully!';
    setTimeout(()=>document.getElementById('pw').style.display='none',800);
    document.getElementById('out').scrollIntoView({behavior:'smooth'});
  }catch(e){
    clearInterval(tk);sp(0);
    setTimeout(()=>document.getElementById('pw').style.display='none',400);
    st.className='st err';st.textContent='Error: '+e.message;
  }finally{btn.disabled=false}
}
</script>
</body>
</html>
